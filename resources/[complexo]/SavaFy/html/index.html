<html>
<header>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'><link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css'>

 
</header>

<main id="main">
  <a class="btn-close" id="close-nui">
    <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-close.svg" class="close">
  </a>

  <div class="header">
    <div class="div-logo">
      <img src="https://v2.celularautenticacaofivem.xyz/imagens/spotify-logo.png" alt="logo">
      <h1>Spotify</h1>
    </div>
    <a href="#modal-musica" id="btn-abrir-modal-music">
      <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-music.png" class="music-atual" class="music">
    </a>
  </div>
  
  <div class="searchbar">
    <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-search.png" width="20" height="20" class="icon-search">
    <a id="abrir-modal-pesquisar" class="pesquisar-title">Pesquisar ...</a>
  </div>

  <!-- <div class="tabs">
    <div class="tabs-bar w3-black">
      <button class="bar-item" id="abrir-tab-disponiveis">Hits</button>
      <button class="bar-item" id="abrir-tab-playlists">Playlists</button>
      <button class="bar-item" id="abrir-tab-curtidas">Curtidas</button>
    </div> -->
    
    <div id="disponiveis" class="div-tab">
      <div id="disponiveis-content">
        </div>
    </div>
    
    <div id="playlists" class="div-tab">
      <div id="playlist-content">
      </div>
    
    </div>
    
    <div id="curtidas" class="div-tab">
      <div class="container-carregando">
        <div class="div-carregando"></div>
      </div>
    </div>
  </div>
  

  <div class="modal-container" id="modal-musica">
    <div class="modal">
      <a href="#" id="btn-close-modal">
        <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-close-modal.png" class="img-close-modal">
      </a>
      <div class="info-album">
        <a class="mudar-volume-changevol" id="music-volume"></a>
        <div class="div-volume">
          <input type="range" min="1" max="100" value="50" class="slider" id="volume-2">
        </div>
        <img class="album-principal">
        <marquee class="nome-musica"></marquee>
        <h2 class="author-musica"></h2>
        <a href="#" id="music-like"></a>
      </div>

      <div class="music-time" style="display:flex;">
        <p class="tempo-atual">02:24</p>
        <p class="tempo-musica">04:43</p>
        <div class="bar-total">
          <div class="bar-tempo"></div>
        </div>
      </div>

      <div class="music-control">
        <a href="#" class="music-previous"></a>

        <a href="#" class="btnPlay play"></a>

        <a href="#" class="music-next">
        </a>
      </div>
    </div>
  </div>
  
  <div class="modal-container" id="modal-pesquisar">
    <div class="modal">
      <a href="#" id="btn-close-modal" class="fechar-modal-pesquisa">
        <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-close-modal.png" class="img-close-modal">
      </a>
      <div class="searchbar" id="form">
        <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-search.png" width="20" height="20" class="icon-search">
         <input type="text" class="input-pesquisar" id="input-pesquisar" placeholder="Buscar..." />
      </div>

      <div id="list-pesquisa">
        <div class="musica-item" href="#">
          <img src="https://v2.celularautenticacaofivem.xyz/imagens/album-lana.jpg" width="30" height="30" alt="">
          <div class="musica-info">
            <a href="#" class="music-nome">Simphony</a>
            <h2>Lana Del Rey</h2>
          </div>
          <a href="#" id="like-musica" class="like-ativo curtir-musica-like"></a>
        </div>
      </div>
      <div id="no-results" class="pesquisa-ativo">
        <h1>O que você deseja ouvir hoje?</h1>
      </div>
    </div>
  </div>
  
  <div class="modal-container" id="modal-playlist">
    <div class="modal rolagem">
      <a href="#" id="btn-close-modal" class="fechar-modal-playlist">
        <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-close-modal.png" class="img-close-modal">
      </a>

      <div class="img-album">
        <img class="img-playlist" alt="">
        
        <a id="btn-play-playlist">
          <img src="https://v2.celularautenticacaofivem.xyz/imagens/icon-play-black.png" alt="">
        </a>
        
      </div>
      
      <div class="content-title">
        <h1 class="title-playlist"></h1>
        <h2 class="author-playlist"></h2>
      </div>

      <div class="playlist-musics">
      </div>
    </div>
  </div>
</main>




<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js" type="text/javascript"></script>

<script src="script.js" type="text/javascript"></script>

</html>
